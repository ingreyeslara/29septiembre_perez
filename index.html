<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARTIAL 1 INDEX</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            text-align: center;
            background-color: #ffffff;
            margin: 0;
            padding: 40px 20px;
            color: #000000;
        }

        h1 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        h2 {
            font-size: 22px;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .logo {
            width: 120px;
            height: auto;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-top: 20px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .btn {
            background-color: #f0f0f0;
            border: 1px solid #767676;
            color: #000;
            padding: 4px 12px;
            font-size: 12px;
            font-family: Arial, sans-serif;
            cursor: pointer;
            margin-bottom: 12px;
            display: inline-block;
        }

        .btn:hover {
            background-color: #e0e0e0;
        }

        .author-name {
            font-size: 32px;
            font-weight: bold;
            margin-top: 30px;
            margin-bottom: 15px;
        }

        .info-text {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin: 8px 0;
        }

        .profile-img {
            width: 260px;
            height: auto;
            margin-top: 30px;
            border-radius: 50% 50% 40% 40%; /* Adjustment to simulate crop shape */
        }
